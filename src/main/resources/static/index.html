<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-container { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; max-width: 600px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: inline-block; width: 150px; }
        .form-group input, .form-group select { width: 250px; padding: 5px; }
        button { padding: 8px 15px; cursor: pointer; }
        .btn-delete { background-color: #f44336; color: white; border: none; padding: 5px 10px; }
    </style>
</head>
<body>

    <h1>Student Management System</h1>

    <div class="form-container">
        <h2>Add New Student</h2>
        <form id="studentForm">
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" required>
            </div>
            <div class="form-group">
                <label for="gpa">GPA:</label>
                <input type="number" step="0.01" id="gpa" required>
            </div>
            <div class="form-group">
                <label for="dateOfBirth">Date of Birth:</label>
                <input type="date" id="dateOfBirth" required>
            </div>
            <div class="form-group">
                <label for="isInternational">International:</label>
                <select id="isInternational">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tuitionFee">Tuition Fee:</label>
                <input type="number" step="0.01" id="tuitionFee" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender (M/F):</label>
                <input type="text" id="gender" maxlength="1" required>
            </div>
            <button type="submit">Add Student</button>
        </form>
    </div>

    <h2>Students List</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>GPA</th>
                <th>DOB</th>
                <th>Intl?</th>
                <th>Tuition Fee</th>
                <th>Gender</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            <!-- Student rows will be added here dynamically -->
        </tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
